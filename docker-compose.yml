version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bereside-postgres
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-bereside_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-bereside_booking_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - bereside-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bereside_admin} -d $${POSTGRES_DB:-bereside_booking_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bereside-api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-bereside_admin}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-bereside_booking_db}
      DATABASE_URL: postgresql://${DB_USER:-bereside_admin}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-bereside_booking_db}?schema=public
    networks:
      - bereside-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  bereside-network:
    driver: bridge
